<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <base id="app-base" href="/">
  <script>
    (function () {
      var path = window.location.pathname;
      var base = "/";
      if (path.indexOf("/VT-GIS") === 0) {
        base = "/VT-GIS/";
      } else if (path.lastIndexOf("/") >= 0) {
        base = path.substring(0, path.lastIndexOf("/") + 1);
      }
      document.getElementById("app-base").href = base;
    })();
  </script>
  <title>VT GIS — WebGIS</title>
  <link rel="icon" href="assets/logo.png?v=2" type="image/png">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin="">
  <link rel="stylesheet" href="css/style.css?v=14">
  <script src="js/auth.js?v=1"></script>
  <script>VTAuth.requireAuth();</script>
</head>
<body>
  <header class="header header--auth">
    <div class="header__logo-wrap">
      <img src="assets/logo.png?v=2" alt="VT GIS" class="header__logo">
    </div>
    <span class="header__title">VT GIS</span>
    <button type="button" id="btn-logout" class="header__logout">Sair</button>
  </header>

  <main class="main">
    <div id="map"></div>

    <div class="map-toolbar">
      <div class="map-toolbar__filters">
        <select id="filter-client" class="map-toolbar__select" aria-label="Filtrar por cliente">
          <option value="" selected>Todos os clientes</option>
        </select>
        <select id="filter-service" class="map-toolbar__select" aria-label="Filtrar por serviço">
          <option value="" selected>Todos os serviços</option>
        </select>
        <button type="button" id="btn-new-service" class="map-toolbar__btn">+ Novo Serviço</button>
      </div>
      <div class="map-toolbar__search">
        <svg class="map-toolbar__search-icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        <input type="search" id="map-search" class="map-toolbar__search-input" placeholder="Buscar imóvel, endereço, lugar, código CAR/SNCR, coordenada ou link do Maps" autocomplete="off">
      </div>
    </div>

    <div class="map-tools">
      <button type="button" id="tool-measure" class="map-tools__btn" title="Medir distância" aria-label="Medir distância">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19L19 5"/><path d="M7.5 16.5l1.3-1.3M10 14l1.3-1.3M12.5 11.5l1.3-1.3M15 9l1.3-1.3"/></svg>
      </button>
      <button type="button" id="tool-draw-area" class="map-tools__btn" title="Desenhar área" aria-label="Desenhar área">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" d="M8 7l7-2 3 7-6 6-6-5z"/><rect x="6.5" y="5.5" width="3" height="3" fill="currentColor"/><rect x="13.5" y="3.5" width="3" height="3" fill="currentColor"/><rect x="16.5" y="10.5" width="3" height="3" fill="currentColor"/><rect x="10.5" y="16.5" width="3" height="3" fill="currentColor"/><rect x="4.5" y="11.5" width="3" height="3" fill="currentColor"/></svg>
      </button>
    </div>

    <div id="tool-hint" class="tool-hint" hidden></div>
  </main>

  <div id="service-modal" class="modal" hidden>
    <div class="modal__panel" role="dialog" aria-labelledby="modal-title">
      <div class="modal__header">
        <div class="modal__title-wrap">
          <span class="modal__title-icon" aria-hidden="true">+</span>
          <h2 id="modal-title" class="modal__title">Novo Serviço</h2>
        </div>
        <button type="button" id="modal-close" class="modal__close" aria-label="Fechar">&times;</button>
      </div>
      <div class="modal__divider"></div>
      <form id="service-form" class="modal__form">
        <p class="modal__intro">Comece só com o essencial. O tipo de serviço e os dados do imóvel você define nas próximas etapas.</p>

        <label class="field">
          <span class="field__label">Nome do serviço *</span>
          <input type="text" id="service-name" placeholder="Ex: Georreferenciamento Fazenda Carrapato" required>
        </label>

        <label class="field">
          <span class="field__label">CPF / CNPJ <span class="field__optional">(opcional)</span></span>
          <input type="text" id="client-doc" placeholder="000.000.000-00 ou 00.000.000/0000-00">
          <span class="field__help">Escolha um cliente pelo número ou digite um CNPJ novo pra buscar o nome.</span>
        </label>

        <label class="field">
          <span class="field__label">Cliente *</span>
          <input type="text" id="client-name" placeholder="Nome do contratante" required>
        </label>

        <div class="modal__divider"></div>
        <div class="modal__actions">
          <button type="button" id="modal-cancel" class="btn btn--ghost">Cancelar</button>
          <button type="submit" class="btn btn--primary">Criar serviço</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
          crossorigin=""></script>
  <script src="js/store.js?v=4"></script>
  <script src="js/tools.js?v=2"></script>
  <script src="js/crm.js?v=10"></script>
  <script src="js/app.js?v=11"></script>
  <script>
    document.getElementById("btn-logout").addEventListener("click", function () {
      VTAuth.logout();
    });
  </script>
</body>
</html>
